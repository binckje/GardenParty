name: garden_party
description: Gestion cosy et kawaii des plantes d'intérieur et d'extérieur.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  uuid: ^4.4.0
  # Prévus pour les étapes suivantes (voir docs/ROADMAP.md) :
  # flutter_local_notifications: ^17.2.1
  # table_calendar: ^3.1.2
  # camera: ^0.11.0
  # http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/plants_fr.json
