name: garden_party
description: Gestion cosy et kawaii des plantes d'intérieur et d'extérieur.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  # Caméra : mesure de lumière (Android, web).
  camera: ^0.12.1
  drift: ^2.35.2
  drift_flutter: ^0.3.1
  # Choix du fichier de sauvegarde à restaurer.
  file_picker: ^13.1.0
  file_saver: ^0.7.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.2
  flutter_riverpod: ^2.5.1
  # Illustrations SVG importées par l'utilisateur.
  flutter_svg: ^2.2.1
  flutter_timezone: ^5.1.1
  go_router: ^14.2.0
  google_fonts: ^6.2.1
  googleapis: ^17.0.0
  googleapis_auth: ^2.3.5
  http: ^1.6.0
  # Capteur de luminosité (Android).
  image_picker: ^1.2.4
  light: ^5.0.0
  shared_preferences: ^2.5.6
  timezone: ^0.11.2
  url_launcher: ^6.3.3
  uuid: ^4.4.0
  # Prévus pour les étapes suivantes (voir docs/ROADMAP.md) :
  # table_calendar: ^3.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ^2.35.1
  build_runner: ^2.16.2

flutter:
  uses-material-design: true
  assets:
    - assets/plants_fr.json
